<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="formulario.css">
</head>
<body>
    <form action="">
        <h1>Preencha o Formulário</h1>
        <div class="container1">
            <label for="">Email: </label>
            <input type="email" name="" id="" placeholder="Digite seu Email">

            <label for="">Senha: </label>
            <input type="password" name="" id="" placeholder="Digite sua Senha"><br>
            
            <label for="" class="opcoes">Marque seu Curso:
                <select name="" id="">
                    <option value="">Ciências da Computação</option>
                    <option value="">Direito</option>
                    <option value="">Educação Física</option>
                    <option value="">Filosofia</option>
                    <option value="">Marketing</option>
                </select>
            </label>

            
            <label class="termos">
                <input type="checkbox">Aceitar todos os termos.
            </label>

            <button type="submit">Enviar</button>
            
        </div>
    </form>
</body>
</html>
